<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Blog - Noticias Embajada Americana · Bgogotá Colombia · Últimas noticias</title>
    <meta name="description" content="Blog con las últimas noticias y novedades sobre la visa americana: trámites, requisitos y cambios.">
    <link rel='stylesheet' href='css/styles.css'>
</head>

<body>
  <header class="header">
    <div class="header__top container">
      <a class="header__logo" href="index.html">Blog - Noticias Visa Americana · Bgogotá Colombia</a>

      <form class="search" action="#" method="get" role="search">
        <label class="visually-hidden" for="buscar">Buscar noticias</label>
        <input class="search__input" type="search" id="buscar" name="q" placeholder="Buscar noticias...">
      </form>
    </div>

    <nav class="nav container" aria-label="Menú principal">
      <a class="nav__link" href="index.html" aria-current="page">Inicio</a>
      <a class="nav__link nav__link--active" href="login.html">Iniciar sesión</a>
      <a class="nav__link" href="registro.html">Registrarse</a>
    </nav>
  </header>

    <main class="main container">
    <h1>Iniciar sesión</h1>

    <form class="form" action="#" method="post">
      <div>
        <label class="form__label" for="email">Email</label>
        <input class="form__input" type="email" id="email" name="email" required>
      </div>
      <div>
        <label class="form__label" for="password">Contraseña</label>
        <input class="form__input" type="password" id="password" name="password" required>
      </div>
      <button class="form__button" type="submit">Entrar</button>
      <p>¿No tienes cuenta? <a class="form__link" href="registro.html">Regístrate</a></p>
    </form>
  </main>


  <footer class="footer">
    <p>© 2026 Blog - Noticias Visa Americana · Trabajo de clase</p>
  </footer>

</body>

</html>
