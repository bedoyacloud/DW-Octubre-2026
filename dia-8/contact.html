<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Grogu - Unofficial Fan Site</title>
    <link rel="icon" href="images/favicon.png">
    <link rel='stylesheet' href='css/main.css'>
    <script src='js/main.js' defer></script>
</head>

<body>
    <header class="header">
        <h1 class="header__title">MAY THE FORCE BE WITH YOU</h1>
        <h2 class="header__subtitle">Un universo de aventuras, amistad y enseñanzas</h2>

        <img src="images/grogu.jpg" alt="Grogu" class="header__image">

        <nav class="nav">
            <ul class="nav__list">
                <li class="nav__item"><a href="index.html" class="nav__link">Inicio</a></li>
                <li class="nav__item"><a href="whatwedo.html" class="nav__link">Presentacion</a></li>
                <li class="nav__item"><a href="about.html" class="nav__link">Quienes somos</a></li>
                <li class="nav__item"><a href="contact.html" class="nav__link nav__link--active">contacto</a></li>
            </ul>
        </nav>
    </header>
    <main class="main">

        <form class="contact-form">
            <h2 class="contact-form__title">Contacta con nosotros</h2>

            <label class="contact-form__label" for="name">Nombre:</label>
            <input class="contact-form__input" type="text" id="name" name="name" placeholder="Tu nombre">

            <label class="contact-form__label" for="email">Correo electrónico:</label>
            <input class="contact-form__input" type="email" id="email" name="email" placeholder="Tu correo">

            <label class="contact-form__label" for="subject">Asunto:</label>
            <input class="contact-form__input" type="text" id="subject" name="subject" placeholder="Motivo del mensaje">

            <label class="contact-form__label" for="message">Mensaje:</label>
            <textarea class="contact-form__input" id="message" name="message" rows="5" placeholder="Escribe tu mensaje"></textarea>

            <button class="contact-form__button" type="submit">Enviar mensaje</button>
        </form>

        <iframe class="contact-map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7022.314462481371!2d-81.56115951773879!3d28.35409565434852!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88dd7fe2ec9a927b%3A0xd8b243af0ea9ce22!2sStar%20Wars%3A%20Galaxy's%20Edge!5e0!3m2!1ses!2ses!4v1793031961133!5m2!1ses!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </main>

    <footer class="footer">
        <p class="footer__text">© 2026 - Star Wars | Página de práctica de HTML y CSS</p>
        <p class="footer__text">Que la Fuerza te acompañe.</p>
    </footer>

</body>

</html>
